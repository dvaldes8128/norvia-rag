[project]
name = "norvia-rag-backend"
version = "0.1.0"
description = "Norvia RAG — multi-tenant policy assistant (FastAPI + Celery + pgvector)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Pinned < 2.1 so opentelemetry-instrumentation-sqlalchemy can instrument the engine
    # (it declares support for "sqlalchemy >= 1.0.0, < 2.1.0"); needed for DB query spans (Q3).
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pypdf>=5.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-api>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-celery>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "httpx>=0.27",
    "tenacity>=9.0",
    "tiktoken>=0.14.0",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML report templates embed long CSS/markup lines.
"eval/experiments/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Compose Postgres + pgvector (Q1.2)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "corpus", "eval"]
