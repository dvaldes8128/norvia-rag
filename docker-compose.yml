services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-norvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-norvia}
      POSTGRES_DB: ${POSTGRES_DB:-norvia}
    ports:
      # Host 5432 is often taken by a local Postgres; map to 5433 for demos.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-norvia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    # Migrate before serve so `docker compose up` works from a fresh volume (E2/Q5).
    command: >
      sh -c "alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    command: celery -A app.workers.celery_app.celery worker --loglevel=INFO

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Vite proxy must reach the Compose service name, not the browser's localhost.
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
